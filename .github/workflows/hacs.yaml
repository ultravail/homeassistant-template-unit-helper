name: Validate HACS

on:
  push:
    branches:
      - "main"
      - "feat**"  
  pull_request:
  schedule:
    - cron: "0 0 * * *"
jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    name: "HACS"
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v4

      - name: "Validate HACS"
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
